<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנקה תמלילי Panopto</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f6f9; color: #333; max-width: 800px; margin: 40px auto; padding: 20px; box-sizing: border-box; }
        h1 { color: #2c3e50; text-align: center; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        select, textarea, button { width: 100%; font-size: 16px; font-family: inherit; margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 200px; resize: vertical; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; transition: background-color 0.3s; padding: 12px; }
        button:hover { background-color: #2980b9; }
        .copy-btn { background-color: #2ecc71; }
        .copy-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <h1>מנקה תמלילי Panopto</h1>
    
    <div class="container">
        <label for="lecturerSelect">בחר/י מרצה:</label>
        <select id="lecturerSelect">
            <option value="Osnat Yam">Osnat Yam</option>
            <option value="Iris Shachar">Iris Shachar</option>
            <option value="Dr. Zohar Rubinstein">Dr. Zohar Rubinstein</option>
            <option value="Daniel Levy">Daniel Levy</option>
            <option value="Roni Partouche">Roni Partouche</option>
            <option value="Galit Butbul">Galit Butbul</option>
        </select>

        <label for="inputText">הדבק/י את התמליל המלא כאן:</label>
        <textarea id="inputText" placeholder="הדבק את הטקסט הגולמי מפנופטו..."></textarea>

        <button onclick="processTranscript()">נקה וסדר טקסט</button>

        <label for="outputText">תוצאה (טקסט רציף ונקי):</label>
        <textarea id="outputText" readonly placeholder="הטקסט הנקי יופיע כאן..."></textarea>
        
        <button class="copy-btn" onclick="copyResult()">העתק תוצאה</button>
    </div>

    <script>
        function processTranscript() {
            const rawText = document.getElementById('inputText').value;
            const targetLecturer = document.getElementById('lecturerSelect').value.trim();
            
            if (!rawText) {
                alert("לא הדבקת טקסט. אנא הדבק את התמלול לפני הלחיצה.");
                return;
            }

            const lines = rawText.split('\n');
            let cleanTextArray = [];
            let isCapturing = false;

            for (let i = 0; i < lines.length; i++) {
                // מנקה רווחים מיותרים בתחילת ובסוף השורה
                let line = lines[i].trim();
                if (line === '') continue; // דילוג על שורות ריקות לגמרי

                // חיפוש תבנית של "שם דובר: " בתחילת השורה
                // מחפש טקסט קצר (עד 40 תווים) שמסתיים בנקודתיים
                let speakerMatch = line.match(/^([^:]{2,40}):/);

                if (speakerMatch) {
                    let speakerName = speakerMatch[1].trim();

                    if (speakerName === targetLecturer) {
                        // זו המרצה שלנו!
                        isCapturing = true;
                        // חותכים החוצה את השם והנקודתיים, ולוקחים רק את הטקסט עצמו
                        let spokenText = line.substring(speakerMatch[0].length).trim();
                        if (spokenText) {
                            cleanTextArray.push(spokenText);
                        }
                    } else {
                        // זה מישהו אחר מדבר (סטודנט או מרצה אחר). עוצרים איסוף.
                        isCapturing = false;
                    }
                } else {
                    // אין שם של דובר בתחילת השורה. 
                    // אם אנחנו כבר באמצע הקלטה של המרצה, זה פשוט המשך המשפט שלה אז נשמור אותו.
                    if (isCapturing) {
                        cleanTextArray.push(line);
                    }
                }
            }

            // חיבור הכל עם רווח וניקוי רווחים כפולים
            let continuousText = cleanTextArray.join(' ').replace(/\s+/g, ' ').trim();
            
            if (continuousText === '') {
                alert("לא נמצא טקסט עבור המרצה שנבחרה. ודא שהשם בתמלול זהה בדיוק לשם ברשימה.");
            }

            document.getElementById('outputText').value = continuousText;
        }

        function copyResult() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) return;
            outputText.select();
            document.execCommand('copy');
            alert('הטקסט הועתק בהצלחה!');
        }
    </script>
</body>
</html>
